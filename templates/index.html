<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Multiplier Demo</title>
    style.css
</head>
<body>

    <header>
        <h1>Flight Multiplier Demo</h1>
        <div class="balance">
            Virtual Credits: <span id="balance">1000</span>
        </div>
    </header>

    <main>

        <section class="game-area">
            <div class="multiplier">
                <h2 id="multiplier">1.00x</h2>
            </div>

            <div class="flight-container">
                ✈️
            </div>

            <div id="status">
                Waiting for next round...
            </div>
        </section>

        <section class="betting-panel">

            <div class="bet-slot">
                <h3>Slot 1</h3>
                <input type="number" placeholder="Credits">
                <button>Play</button>
                <button>Cash Out</button>
            </div>

            <div class="bet-slot">
                <h3>Slot 2</h3>
                <input type="number" placeholder="Credits">
                <button>Play</button>
                <button>Cash Out</button>
            </div>

            <div class="bet-slot">
                <h3>Slot 3</h3>
                <input type="number" placeholder="Credits">
                <button>Play</button>
                <button>Cash Out</button>
            </div>

        </section>

        <section class="history">
            <h3>Previous Rounds</h3>
            <ul id="history-list">
                <h1>Login</h1>

<form method="POST">
  <input type="text" name="username" placeholder="Username">
  <input type="password" name="password" placeholder="Password">
  <button type="submit">Login</button>
</form>
                
                <li>2.15x</li>
                <li>5.80x</li>
                <li>1.32x</li>
            </ul>
        </section>

    </main>

    script.jsscript>

</body>
</html>
